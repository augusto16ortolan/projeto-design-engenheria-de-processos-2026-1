services:
  postgres:
    image: postgres:16-alpine
    container_name: integration-api-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: integration_api
    ports:
      - "5432:5432"
    volumes:
      - integration-api-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d integration_api"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    container_name: integration-api
    restart: always
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/integration_api
      HOST: 0.0.0.0
      PORT: 3333
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  integration-api-postgres-data:
